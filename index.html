<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Track</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Weather Track</h1>
    <p>Check the weather in your city.</p>

    <input type="text" id="cityInput" placeholder="Enter a city">
    <button id="searchButton">Search</button>

    <div id="weather">
    <h2 id="cityName">Los Angeles</h2>
    <p id="temperature">Temperature: 75°F</p>
    <p id="condition">Condition: Sunny</p>
    <p id="humidity">Humidity: 40%</p>
    <p id="wind">Wind: 5 mph</p>
</div>

    <script src="script.js"></script>

</body>

</html>
